<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="izzacPineBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#142921" />
      <stop offset="55%" stop-color="#0D1713" />
      <stop offset="100%" stop-color="#070D0B" />
    </linearGradient>
    <linearGradient id="izzacRim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#11694E" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0D1713" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="izzacEmeraldTrack" x1="20" y1="48" x2="46" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="55%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <linearGradient id="izzacAlabasterTrack" x1="16" y1="16" x2="42" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBFAF7" />
      <stop offset="100%" stop-color="#E6E2D8" />
    </linearGradient>
    <radialGradient id="izzacGlow" cx="50%" cy="16%" r="68%">
      <stop offset="0%" stop-color="#11694E" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0D1713" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Container -->
  <rect width="64" height="64" rx="15" fill="url(#izzacPineBg)" />
  <rect width="64" height="64" fill="url(#izzacGlow)" rx="15" />
  <rect x="1" y="1" width="62" height="62" rx="14" stroke="url(#izzacRim)" stroke-width="1.5" />

  <!-- Upper Lane: Rider Mobility Track -->
  <path
    d="M 17.5 18 H 39.5 L 20.5 37"
    stroke="url(#izzacAlabasterTrack)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Lower Lane: Host Fleet Track (180-deg symmetric) -->
  <path
    d="M 46.5 46 H 24.5 L 43.5 27"
    stroke="url(#izzacEmeraldTrack)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Telemetry Endpoint Nodes -->
  <circle cx="17.5" cy="18" r="1.8" fill="#0D1713" />
  <circle cx="46.5" cy="46" r="1.8" fill="#0D1713" />
</svg>
